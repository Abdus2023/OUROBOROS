[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ourob-m0"
version = "0.1.0"
description = "Deterministic repository-native autonomous engineering runtime"
requires-python = ">=3.11"

[project.scripts]
ourob = "ourob.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ourob*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
